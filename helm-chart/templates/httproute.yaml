{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: my-app-httproute
  namespace: {{ .Release.Namespace | default "training-application" }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "" }}
      namespace: {{ .Values.gateway.namespace | default .Release.Namespace }}
  hostnames:
    - {{ .Values.gateway.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-app
          port: 80
{{- end }}
